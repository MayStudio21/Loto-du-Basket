<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="icon" href="logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Loto du Basket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="balls" aria-hidden="true" id="balls"></div>
<header class="top">
  <img class="logo" src="logo.png" alt="US Grassoise Basketball – Green Team">
  <div>
    <p class="pre">L'Union Sportive Grassoise présente</p>
    <h1 class="title">Le <span class="o">Loto</span> du Basket</h1>
  </div>
</header>
<div class="app">
  <aside class="side">
    <div class="board">
      <div class="lbl">Dernier numéro</div>
      <div class="big empty" id="big">--</div>
      <div>
        <div class="lbl">Précédents</div>
        <div class="prev" id="prev"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">Boules tirées</span><b id="count">0</b></div>
      <div class="stat"><span class="lbl">Restantes</span><b id="left">100</b></div>
    </div>
    <div class="btns">
      <button id="undo" type="button">Annuler le dernier</button>
      <button id="fs" type="button">Plein écran</button>
      <button class="reset" id="reset" type="button">Nouvelle partie</button>
    </div>
    <p class="foot">Re-cliquer une case entourée la démarque. Raccourci <kbd>Ctrl</kbd>+<kbd>Z</kbd> pour annuler. La partie est gardée si la page est rechargée.</p>
  </aside>
  <main class="stage">
    <div class="gridwrap"><div class="grid" id="grid" role="grid" aria-label="Grille du loto, numéros 1 à 100"></div></div>
  </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="box">
    <h2 id="mt">Nouvelle partie ?</h2>
    <p id="mp">Toutes les cases seront remises à zéro.</p>
    <div class="btns"><button id="no" type="button">Non, continuer</button><button id="yes" type="button">Oui, on recommence</button></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
